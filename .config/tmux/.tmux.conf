#                                TMUX CONFIG                                 #
#                          Unokai Color Scheme Applied                       #

# 1. GENERAL SETTINGS                                                        #

# Use bash as the default shell
set-option -g default-shell "/bin/bash"

# Configure terminal capabilities for true colors
# 'xterm-256color' generally offers broad compatibility with true color support.
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc" # :Tc enables 24-bit true colors

# History and Buffer Limits
set -g history-limit 10000 # Increase scrollback history
set -g buffer-limit 20    # Number of paste buffers to keep

# Speed and Display Settings
set -sg escape-time 0     # Reduce delay for escape sequences (e.g., Vim)
set -g display-time 1500  # How long messages are displayed in the status bar (ms)
set -g remain-on-exit off # Don't keep pane around after program exits
set -g repeat-time 300    # Time a repeated command is valid

# Environment Variables
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
setenv -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock # Forward SSH agent

# Window/Pane Naming
setw -g allow-rename off       # Prevent automatic window renaming by applications
setw -g automatic-rename off   # Disable automatic window renaming by tmux
setw -g aggressive-resize on   # More aggressive resizing for panes

# 2. KEY BINDINGS                                                            #

# Set Prefix Key
set -g prefix C-a         # Set prefix key to Ctrl-a
unbind C-b                # Unbind default Ctrl-b
bind C-a send-prefix      # Send Ctrl-a to application (if pressed twice)

# Configuration Reload
bind R source-file ~/.tmux.conf \; display-message "Reloading config..."

# Window Management
bind c new-window -c "#{pane_current_path}" # New window in current pane's path
bind r command-prompt -I "#W" "rename-window -- '%%'" # Rename current window
unbind p # Unbind default 'previous-window'
bind b previous-window   # Rebind 'previous-window' to 'b' (Ctrl-a b)

# Pane Splitting
bind-key % split-window -h -c "#{pane_current_path}" # Split horizontally in current path
bind-key '"' split-window -v -c "#{pane_current_path}" # Split vertically in current path

# Pane Joining (move pane to another window)
bind-key S choose-window "join-pane -v -s "%%"" # Join pane vertically from another window
bind-key V choose-window "join-pane -h -s "%%"" # Join pane horizontally from another window

# Pane Navigation (Vim-style)
bind h select-pane -L # Left
bind j select-pane -D # Down
bind k select-pane -U # Up
bind l select-pane -R # Right

# Pane Resizing
bind + resize-pane -U 5 # Up by 5 lines
bind - resize-pane -D 5 # Down by 5 lines
bind < resize-pane -L 5 # Left by 5 columns
bind > resize-pane -R 5 # Right by 5 columns

# Copy Mode (Vim-style)
setw -g mode-keys vi # Set vi mode for copy mode
# Start selection with 'space', copy with 'y', and pipe to clipboard (xclip)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Window Swapping (Ctrl-Shift-Left/Right outside of tmux prefix)
bind-key -n C-S-Right swap-window -t +1
bind-key -n C-S-Left swap-window -t -1

# Custom Script for Session Selection
bind-key -r f run-shell "tmux neww ~/.local/scripts/sessionizer"

# Kill current session and switch to selected one (with confirmation for attached sessions)
bind-key C-s \
  if-shell "(($(tmux display -p '#{session_many_attached}') > 0))" \
    choose-session \
    "run-shell \"tmux choose-session \\\"switch-client -t '%%'; kill-session -t '$(tmux display -p '#S')'\\\"\""

# 3. STATUS BAR

set-option -g status on                  # Enable the status bar
set-option -g status-interval 1          # Update status bar every 1 second
set-option -g automatic-rename on        # Enable automatic window renaming
set-option -g automatic-rename-format '#{pane_current_command}' # Format for auto-renamed windows

# Status Bar Positioning and Length
set -g status-position bottom  # Place status bar at the bottom
set -g status-left-length 20   # Length of the left status segment
set -g status-right-length 100 # Length of the right status segment

# 4. COLOR SCHEME (UNOKAI)

# Define Unokai Colors as variables for easier use
# Primary colors
set -g @unokai_bg '#212121' # background
set -g @unokai_fg '#f8f8f2' # foreground

# Normal ANSI colors
set -g @unokai_red '#c61e5c'   # normal red
set -g @unokai_green '#81af24' # normal green
set -g @unokai_yellow '#fd971f' # normal yellow
set -g @unokai_blue '#51aebe'  # normal blue
set -g @unokai_magenta '#ae81ff' # normal magenta
set -g @unokai_cyan '#80beb5'  # normal cyan
set -g @unokai_white '#bababa' # normal white

# Bright ANSI colors
set -g @unokai_bright_red '#f92672'
set -g @unokai_bright_green '#a6e22e'
set -g @unokai_bright_yellow '#e6db74'
set -g @unokai_bright_blue '#66d9ef'
set -g @unokai_bright_magenta '#fd5ff0'
set -g @unokai_bright_cyan '#a1efe4'
set -g @unokai_bright_white '#f8f8f2' # This matches @unokai_fg

# Dim colors (for subtle elements)
set -g @unokai_dim_foreground '#74705d' # dim_foreground

# Status Bar Colors
set-option -g status-style bg="#{@unokai_bg}",fg="#{@unokai_fg}"

# Window Status (Title) Colors
# Inactive window titles: background is primary background, text is normal green
set-window-option -g window-status-style bg="#{@unokai_bg}",fg="#{@unokai_green}"
# Active window titles: background is primary background, text is normal yellow
set-window-option -g window-status-current-style bg="#{@unokai_bg}",fg="#{@unokai_yellow}"

# Pane Border Colors
# Active pane border: normal blue
set-option -g pane-active-border-style fg="#{@unokai_blue}"
# Inactive pane border: dim foreground for subtlety
set-option -g pane-border-style fg="#{@unokai_dim_foreground}"

# Message Bar Colors (for command prompts and messages)
# Both command prompt and regular messages use primary background and normal yellow text
set-option -g message-command-style bg="#{@unokai_bg}",fg="#{@unokai_yellow}"
set-option -g message-style bg="#{@unokai_bg}",fg="#{@unokai_yellow}"

# Status Left Segment (Session Name)
# Text uses foreground, brackets use normal green
set-option -g status-left "#[fg=#{@unokai_fg}]#[bg=#{@unokai_bg}] #[fg=#{@unokai_green}]\[#[fg=#{@unokai_fg}]#S#[fg=#{@unokai_green}]\] "

# Status Right Segment (Date and Time)
# Text uses foreground
set-option -g status-right "#[fg=#{@unokai_fg}]#[bg=#{@unokai_bg}] (%a) %d-%b-%Y %H:%M "

# Optional: Detailed Window Status Formats (if you want the powerline-style separators)
# Active window format: ID:Name in bright yellow, with a bright yellow background for the separator
set-option -g window-status-current-format "#[fg=#{@unokai_bright_yellow}]#I:#W#[fg=#{@unokai_bg}]#[bg=#{@unokai_bright_yellow}]"
# Inactive window format: ID:Name in normal green, with a normal green background for the separator
set-option -g window-status-format "#[fg=#{@unokai_bright_green}]#I:#W#[fg=#{@unokai_bg}]#[bg=#{@unokai_bright_green}]"

# 5. PLUGINS

# Example plugin: tmux-resurrect for saving/restoring sessions
# run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
